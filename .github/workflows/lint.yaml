name: "Lint"

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  php-cs-fixer:
    name: PHP-CS-Fixer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check whether PHP project exists
        id: php
        shell: bash
        run: |
          if [[ -f composer.json ]]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - name: PHP-CS-Fixer
        if: steps.php.outputs.present == 'true'
        uses: docker://ghcr.io/php-cs-fixer/php-cs-fixer:3-php8.4
        with:
          args: check --diff --using-cache=no
      - name: Documentation-only validation
        if: steps.php.outputs.present != 'true'
        run: echo "No root composer.json; PHP formatting is not applicable."

  linters:
    name: Linters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Detect PHP project
        id: php
        shell: bash
        run: |
          if [[ -f composer.json ]]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: shivammathur/setup-php@v2
        if: steps.php.outputs.present == 'true'
        with:
          coverage: none
          extensions: intl
          php-version: '8.4'
          tools: composer:v2
      - name: Validate Composer
        if: steps.php.outputs.present == 'true'
        run: composer validate --no-check-publish --strict
      - name: Install dependencies
        if: steps.php.outputs.present == 'true'
        run: composer install --ansi --no-interaction --no-progress
      - name: Lint Symfony resources
        if: steps.php.outputs.present == 'true'
        shell: bash
        run: |
          ./bin/console lint:yaml config --parse-tags
          ./bin/console lint:twig templates --env=prod
          ./bin/console lint:xliff translations
          ./bin/console lint:translations
          ./bin/console lint:container --no-debug
          ./bin/console doctrine:schema:validate --skip-sync -vvv --no-interaction
          composer audit
      - name: No PHP application at repository root
        if: steps.php.outputs.present != 'true'
        run: echo "PHP-specific linters are not applicable to this repository layout."

  static-analysis:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Detect PHP project
        id: php
        shell: bash
        run: |
          if [[ -f composer.json ]]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: shivammathur/setup-php@v2
        if: steps.php.outputs.present == 'true'
        with:
          coverage: none
          php-version: '8.4'
      - name: Install dependencies
        if: steps.php.outputs.present == 'true'
        run: composer install --ansi --no-interaction --no-progress
      - name: Run PHPStan
        if: steps.php.outputs.present == 'true'
        run: vendor/bin/phpstan analyze --no-progress
      - name: No PHP application at repository root
        if: steps.php.outputs.present != 'true'
        run: echo "PHPStan is not applicable without a root Composer project."
